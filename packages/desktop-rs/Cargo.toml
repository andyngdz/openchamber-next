[workspace]
resolver = "3"
members = [
    "crates/oc-sidecar",
    "crates/oc-client",
    "crates/oc-state",
    "crates/oc-app",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
oc-sidecar = { path = "crates/oc-sidecar" }
oc-client = { path = "crates/oc-client" }
oc-state = { path = "crates/oc-state" }

chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
eventsource-stream = "0.2"
futures = "0.3"
gpui-kit = "0.9.1"
image = { version = "0.25", default-features = false, features = ["png"] }
nix = { version = "0.31", features = ["process", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["cookies", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.29", features = ["v4"] }

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
